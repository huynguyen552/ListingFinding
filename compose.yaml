name: leadfinder
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadfinder}
      POSTGRES_DB: ${POSTGRES_DB:-leadfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/manage.py init first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-leadfinder}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      REDIS_URL: redis://redis:6379/0
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      scheduler:
        condition: service_started
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend-env
    command: [celery, -A, app.worker.celery, worker, --concurrency=1, --loglevel=INFO, --hostname=crawler@%h]
    shm_size: 256mb
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  scheduler:
    build: ./backend
    environment: *backend-env
    command: [celery, -A, app.worker.celery, beat, --loglevel=INFO, --schedule=/tmp/leadfinder-beat]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
